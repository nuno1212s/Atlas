[package]
name = "atlas-common"
version = "0.1.0"
description = "Common tools and dependencies for the Atlas project"
authors = ["Nuno Neto <nuno.martingo@fc.up.pt>"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/nuno1212s/atlas"
repository = "https://github.com/nuno1212s/atlas"
documentation = "https://docs.rs/atlas"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]

# There is deliberately no backend in `default`. Each group below picks its
# implementation at compile time from the *absence* of an override flag, so a
# plain build gets the standard stack, and adding one feature anywhere in the
# dependency graph switches that group. Cargo features are additive and unioned
# graph-wide, so a positive default could only be turned off with
# `default-features = false` on every one of the ~20 edges that reach this crate
# -- which is what this arrangement exists to avoid.
#
# The consequence is that each group's default backend is a non-optional
# dependency: Cargo cannot enable an optional dependency from the absence of a
# feature (neither from here nor from a build script).
#
# | group            | default when no flag is set | override with                          |
# |------------------|-----------------------------|----------------------------------------|
# | async runtime    | tokio                       | async_runtime_async_std                |
# | socket           | tokio TCP                   | socket_async_std_tcp, socket_rio_tcp   |
# | threadpool       | rayon                       | threadpool_crossbeam                   |
# | hash             | blake3                      | crypto_hash_ring_sha2                  |
# | async channel    | flume                       | channel_async_channel_mpmc             |
# | sync channel     | crossbeam                   | channel_sync_flume                     |
# | dump queue       | mqueue                      | channel_custom_dump_lfb                |
# | RandomState      | fxhash                      | collections_randomstate_{std,twox_hash,gxhash} |
# | persistent db    | sled                        | persistent_db_rocksdb, persistent_db_disabled  |
#
# Selecting two backends from the same group is rejected by build.rs.
#
# `serialize_serde` is the one deliberate exception: it is not a backend choice
# but a cross-cutting derive gate, wired through ~12 sibling crates, so it stays
# a positive default feature.
default = ["serialize_serde"]

# Async socket alternatives; omit for tokio TCP
socket_async_std_tcp = ["async-std"]
socket_rio_tcp = ["rio"]

# Async runtime alternatives; omit for tokio
async_runtime_async_std = ["async-std"]

# Hash alternatives; omit for blake3
crypto_hash_ring_sha2 = []

# Threadpool alternatives; omit for rayon
threadpool_crossbeam = ["threadpool-crossbeam-channel"]

# Async channel alternatives; omit for flume
channel_async_channel_mpmc = ["async-channel"]

# Sync channel alternatives; omit for crossbeam
channel_sync_flume = []

# Queue backing the multiple-dumping channel; omit for mqueue
channel_custom_dump_lfb = []

# RandomState alternatives; omit for fxhash
collections_randomstate_std = []
collections_randomstate_twox_hash = ["twox-hash"]
# Requires AES + SSE2 intrinsics, i.e. build with
#   RUSTFLAGS="-C target-feature=+aes,+sse2"   (or -C target-cpu=native)
# otherwise gxhash itself fails to compile. There is no way to express this from
# a manifest, so it has to be set in the environment or a .cargo/config.toml.
collections_randomstate_gxhash = ["gxhash"]

# Persistent db alternatives; omit for sled.
# `persistent_db_disabled` swaps in a no-op store that drops every write, which
# is useful when benchmarking without persistence in the way.
persistent_db_rocksdb = ["rocksdb"]
persistent_db_disabled = []

serialize_serde = ["serde", "serde-big-array"]
# Currently not working due to missing implementations after big refactor
serialize_capnp = []

[dependencies]
either = "1"
tokio-rustls = "0.26"
rustls = "0.23"
futures = "0.3.26"
dashmap = "6"
thread_local = "1.1.4"
socket2 = { version = "0.5", features = ["all"] }
strum = { version = "*", features = ["derive"] }
linked-hash-map = "0.5"

mio = { version = "*", features = ["os-poll", "net"] }
async-std = { version = "1", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
ring = { version = "0.17" }
threadpool-crossbeam-channel = { version = "1.8.0", optional = true }

serde = { version = "*", features = ["derive", "rc"], optional = true }
serde-big-array = { version = "0.5.0", optional = true }
bincode = { version = "2", features = ["default", "serde"] }
tracing = "0"

rayon = { version = "*" }
rio = { version = "0.9", optional = true }
blake3 = { version = "1" }
flume = { version = "0" }
async-channel = { version = "2", optional = true }
pin-project-lite = "0.2"
twox-hash = { version = "2", optional = true }
rustc-hash = { version = "*" }
gxhash = { version = "*", optional = true }
dsrust = { version = "0.1.9", git = "https://github.com/nuno1212s/DSRust" }
crossbeam-channel = { version = "0.5" }
rocksdb = { version = "0", optional = true }
sled = { version = "*" }
oneshot = { version = "*", features = ["std", "async"] }
anyhow = "1"
thiserror = "2"
getset = "0"
num-bigint = "0.4.3"
num-traits = "0.2.15"
threshold_crypto = { version = "0.4.0", git = "https://github.com/poanetwork/threshold_crypto" }
# This is here because of the threshold crypto requirements, which require us to use this version of rand
rand = "0.7.3"
frost-ed25519 = { version = "2.0.0", features = ["serde"] }
frost-core = { version = "2.0.0", features = ["serde"] }

[build]
# Option A: optimize for the current CPU
rustflags = ["-C", "target-cpu=native"]

[dev-dependencies]
criterion = "*"

[[bench]]
name = "threshold_crypto_bench"
harness = false

[[bench]]
name = "tbo_queue_bench"
harness = false

[[bench]]
name = "sync_select_bench"
harness = false